<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%" style="display: block; margin: 0; padding: 0;">
    <defs>
        <style>
            .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
            .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #a0a0a0; text-anchor: middle; }
            .math { font-family: 'Times New Roman', Times, serif; font-size: 20px; fill: #ffffff; text-anchor: middle; font-style: italic; }
            .color-a { fill: #a1f541; }
            .color-i { fill: #ffe5b4; }
            .coral { fill: #ff563f; }
            .bracket { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
            .bracket-a { stroke: #a1f541; }
            .bracket-i { stroke: #ffe5b4; }
            .bracket-inv { stroke: #ff563f; }
            .arrow { fill: none; stroke: #888888; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
            .arrow-head { fill: #888888; }
            .arrow-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #888888; text-anchor: middle; }
        </style>
    </defs>
    <rect width="100%" height="100%" fill="#1e1e1e"/>

    <text x="450" y="30" class="title">Esquema visual del Método de Gauss-Jordan</text>
    <text x="450" y="55" class="subtitle">La Identidad "graba" las operaciones mientras la matriz se convierte en la Inversa</text>

    <text x="150" y="110" class="subtitle">Punto de partida</text>
    <text x="150" y="135" class="math">[ A | I ]</text>

    <g transform="translate(70, 160)">
        <path d="M 10,0 L 0,0 L 0,80 L 10,80" class="bracket bracket-a"/>
        <text x="25" y="25" class="math color-a">a</text>
        <text x="65" y="25" class="math color-a">b</text>
        <text x="25" y="65" class="math color-a">c</text>
        <text x="65" y="65" class="math color-a">d</text>
        <path d="M 80,0 L 90,0 L 90,80 L 80,80" class="bracket bracket-a"/>
    </g>

    <line x1="180" y1="170" x2="180" y2="240" stroke="#666666" stroke-width="2" stroke-dasharray="4,4"/>

    <g transform="translate(200, 160)">
        <path d="M 10,0 L 0,0 L 0,80 L 10,80" class="bracket bracket-i"/>
        <text x="25" y="25" class="math color-i">1</text>
        <text x="65" y="25" class="math color-i">0</text>
        <text x="25" y="65" class="math color-i">0</text>
        <text x="65" y="65" class="math color-i">1</text>
        <path d="M 80,0 L 90,0 L 90,80 L 80,80" class="bracket bracket-i"/>
    </g>


    <path d="M 320,200 L 540,200" class="arrow"/>
    <polygon points="540,192 555,200 540,208" class="arrow-head"/>

    <text x="430" y="185" class="arrow-text">Operaciones elementales de fila</text>

    <text x="750" y="110" class="subtitle">Resultado final</text>
    <text x="750" y="135" class="math">[ I | A⁻¹ ]</text>

    <g transform="translate(630, 160)">
        <path d="M 10,0 L 0,0 L 0,80 L 10,80" class="bracket bracket-i"/>
        <text x="25" y="25" class="math color-i">1</text>
        <text x="65" y="25" class="math color-i">0</text>
        <text x="25" y="65" class="math color-i">0</text>
        <text x="65" y="65" class="math color-i">1</text>
        <path d="M 80,0 L 90,0 L 90,80 L 80,80" class="bracket bracket-i"/>
    </g>

    <line x1="740" y1="170" x2="740" y2="240" stroke="#666666" stroke-width="2" stroke-dasharray="4,4"/>

    <g transform="translate(760, 160)">
        <path d="M 10,0 L 0,0 L 0,80 L 10,80" class="bracket bracket-inv"/>
        <text x="25" y="25" class="math coral">a⁻¹</text>
        <text x="65" y="25" class="math coral">b⁻¹</text>
        <text x="25" y="65" class="math coral">c⁻¹</text>
        <text x="65" y="65" class="math coral">d⁻¹</text>
        <path d="M 80,0 L 90,0 L 90,80 L 80,80" class="bracket bracket-inv"/>
    </g>

    <rect x="100" y="300" width="300" height="70" rx="8" fill="none" stroke="#ffe5b4" stroke-width="2"/>
    <text x="250" y="325" class="subtitle" style="fill: #ffe5b4; font-weight: bold;">Matriz Identidad (I)</text>
    <text x="250" y="345" class="subtitle" style="fill: #ffffff; font-size: 12px;">Empieza siendo la matriz neutra,</text>
    <text x="250" y="362" class="subtitle" style="fill: #ffffff; font-size: 12px;">pero "graba" cada operación de fila.</text>
    <rect x="500" y="300" width="300" height="70" rx="8" fill="none" stroke="#a1f541" stroke-width="2"/>
    <text x="650" y="325" class="subtitle" style="fill: #a1f541; font-weight: bold;">Matriz Original (A)</text>
    <text x="650" y="345" class="subtitle" style="fill: #ffffff; font-size: 12px;">Sufre las operaciones hasta</text>
    <text x="650" y="362" class="subtitle" style="fill: #ffffff; font-size: 12px;">convertirse en la Identidad.</text>

</svg>
