<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      .bg { fill: #080b08; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 800; fill: #fefae0; letter-spacing: 0.5px; }
      .matrix-bracket { stroke: #a3e635; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .text-num { font-family: 'Courier New', monospace; font-size: 32px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; }
      .arrow { stroke: #fb923c; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-head { fill: #fb923c; }
      .box { rx: 12px; ry: 12px; }
      .green { fill: #a3e635; }
      .coral { fill: #fb7185; }
      .orange { fill: #fb923c; }
      .cream { fill: #fefae0; }
      .muted { fill: #a3a3a3; }
      .shadow-green { filter: drop-shadow(0 0 8px rgba(163, 230, 53, 0.2)); }
      .shadow-coral { filter: drop-shadow(0 0 8px rgba(251, 113, 133, 0.2)); }
      .shadow-orange { filter: drop-shadow(0 0 8px rgba(251, 146, 60, 0.2)); }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  <text x="475" y="50" class="title" text-anchor="middle">Cálculo de la Inversa de una Matriz 2×2</text>

  <g transform="translate(80, 100)">
    <text x="75" y="-20" class="label muted" text-anchor="middle">Matriz Original A</text>
    <path d="M 30,10 L 10,10 L 10,120 L 30,120" class="matrix-bracket" />
    <path d="M 120,10 L 140,10 L 140,120 L 120,120" class="matrix-bracket" />
    <text x="50" y="40" class="text-num green shadow-green">a</text>
    <text x="100" y="40" class="text-num coral shadow-coral">b</text>
    <text x="50" y="90" class="text-num coral shadow-coral">c</text>
    <text x="100" y="90" class="text-num green shadow-green">d</text>
  </g>

  <g transform="translate(250, 160)">
    <line x1="0" y1="0" x2="80" y2="0" class="arrow" />
    <polygon points="80,-8 95,0 80,8" class="arrow-head" />
  </g>

  <g transform="translate(370, 100)">
    <text x="85" y="-20" class="label muted" text-anchor="middle">Transformación (Posición y Signo)</text>
    <path d="M 30,10 L 10,10 L 10,120 L 30,120" class="matrix-bracket" />
    <path d="M 140,10 L 160,10 L 160,120 L 140,120" class="matrix-bracket" />
    <text x="50" y="40" class="text-num green shadow-green">d</text>
    <text x="115" y="40" class="text-num coral shadow-coral">-b</text>
    <text x="50" y="90" class="text-num coral shadow-coral">-c</text>
    <text x="115" y="90" class="text-num green shadow-green">a</text>
  </g>

  <g transform="translate(700, 160)">
    <text x="0" y="0" class="text-num orange shadow-orange" text-anchor="start">÷ (ad - bc)</text>
    <text x="-50" y="35" class="label orange" text-anchor="start">Determinante |A|</text>
  </g>

  <g transform="translate(50, 290)">

    <rect x="0" y="0" width="400" height="80" fill="#131a0f" class="box shadow-green" stroke="#a3e635" stroke-width="2" />
    <text x="20" y="32" class="label green">🔄 Diagonal PRINCIPAL (a, d):</text>
    <text x="20" y="58" class="label cream">Se INTERCAMBIAN de posición entre sí.</text>

    <rect x="420" y="0" width="400" height="80" fill="#1f1315" class="box shadow-coral" stroke="#fb7185" stroke-width="2" />
    <text x="440" y="32" class="label coral">➕/➖ Diagonal SECUNDARIA (b, c):</text>
    <text x="440" y="58" class="label cream">Conservan su lugar, pero CAMBIAN de signo.</text>

    <rect x="0" y="100" width="820" height="60" fill="#1f1810" class="box shadow-orange" stroke="#fb923c" stroke-width="2" />
    <text x="50" y="135" class="label orange">⚠️ Escalar:</text>
    <text x="135" y="135" class="label cream">Todo se divide entre el determinante:</text>
    <text x="440" y="135" class="label orange">det(A) = ad - bc</text>
    <text x="580" y="135" class="label coral">(Debe ser ≠ 0!)</text>
  </g>
</svg>
